name: Verify Drinkable City
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: drinkable
          POSTGRES_PASSWORD: local-ci-only-password
          POSTGRES_DB: drinkable_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U drinkable -d drinkable_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports: [1025:1025, 8025:8025]
    env:
      DATABASE_URL: postgresql://drinkable:local-ci-only-password@localhost:5432/drinkable_test
      TEST_DATABASE_URL: postgresql://drinkable:local-ci-only-password@localhost:5432/drinkable_test
      BETTER_AUTH_SECRET: ci-only-authentication-secret-32-characters
      DEMO_PASSWORD: Drinkable-CI-Test-Only-2026
      APP_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MEDIA_ROOT: /tmp/drinkable-ci-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@12.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm typecheck && pnpm lint && pnpm test
      - run: pnpm db:migrate && pnpm test:integration
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start application and worker
        run: |
          pnpm start > /tmp/drinkable-web.log 2>&1 &
          pnpm worker > /tmp/drinkable-worker.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/drinkable-web.log
          exit 1
      - run: pnpm test:e2e
      - name: Validate Docker image and production Compose configuration
        env:
          POSTGRES_PASSWORD: local-ci-only-password-long
          SITE_DOMAIN: staging.example.test
          ACME_EMAIL: test@example.test
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.production.yaml config --quiet
          docker build --target runtime -t drinkable:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report
            test-results
